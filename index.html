<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense and Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-left"><h1>&#128181;Expense and Budget Visualizer</h1></div>
    <div class="header-right">
      <button id="themeToggle" onclick="toggleTheme()">&#9728;&#65039; Mode Terang</button>
    </div>
  </header>
  <section class="card balance-card">
    <p class="balance-label">Total Pengeluaran</p>
    <p id="totalBalance" class="balance-amount">Rp 0</p>
  </section>
  <section class="card">
    <h2>Tambah Transaksi</h2>
    <form id="transactionForm" onsubmit="addTransaction(event)">
      <div class="form-row">
        <div class="form-group">
          <label for="itemName">Nama Item</label>
          <input type="text" id="itemName" placeholder="Contoh: Nasi Goreng">
        </div>
        <div class="form-group">
          <label for="itemAmount">Jumlah (Rp)</label>
          <input type="number" id="itemAmount" placeholder="Contoh: 25000" min="1">
        </div>
        <div class="form-group">
          <label for="itemCategory">Kategori</label>
          <select id="itemCategory">
            <option value="">-- Pilih Kategori --</option>
            <option value="Food">Makanan</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Hiburan</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-primary">+ Tambah Transaksi</button>
    </form>
    <div class="custom-category">
      <h3>Tambah Kategori Baru</h3>
      <div class="category-input-row">
        <input type="text" id="customCategoryName" placeholder="Nama kategori baru...">
        <button onclick="addCustomCategory()" class="btn-secondary">+ Tambah</button>
      </div>
    </div>
  </section>
  <section class="card">
    <div class="list-header">
      <h2>Daftar Transaksi</h2>
      <div class="sort-control">
        <label for="sortSelect">Urutkan:</label>
        <select id="sortSelect" onchange="renderTransactions()">
          <option value="default">Terbaru</option>
          <option value="amount-asc">Jumlah Kecil ke Besar</option>
          <option value="amount-desc">Jumlah Besar ke Kecil</option>
          <option value="category">Kategori A-Z</option>
        </select>
      </div>
    </div>
    <div id="transactionList" class="transaction-list">
      <p class="empty-state">Belum ada transaksi. Tambahkan di atas!</p>
    </div>
  </section>
  <section class="card">
    <h2>&#128202; Pengeluaran per Kategori</h2>
    <div class="chart-container">
      <canvas id="expenseChart"></canvas>
    </div>
  </section>
  <script src="js/app.js"></script>
</body>
</html>
